- name: cart
  states:
    - name: cart empty
    - name: cart non-empty
  initialState: cart empty
  data:
    painting count: ""
  dataExampleValues:
    - painting count: "0"
    - painting count: "1"
    - painting count: "2"
  defaultPreconditions:
    - state: user session present
  transitions:
    - id: "014"
      states:
        - name: cart empty
          arguments:
            - qualifier: with
              name: painting count
              condition:
                operator: =
                value: "0"
      trigger:
        name: painting added to cart
      result:
        name: cart non-empty
        arguments:
          - qualifier: with
            name: painting count
            condition:
              operator: =
              value: "1"
    - id: "015"
      states:
        - name: cart non-empty
      trigger:
        name: painting added to cart
      result:
        name: cart non-empty
        arguments:
          - preQualifier: with
            modifier: incremented
            name: painting count
    - id: "016"
      states:
        - name: cart non-empty
          arguments:
            - qualifier: with
              name: painting count
              condition:
                operator: ">"
                value: "1"
      trigger:
        name: painting removed from cart
      result:
        name: cart non-empty
        arguments:
          - preQualifier: with
            modifier: decremented
            name: painting count
    - id: "017"
      states:
        - name: cart non-empty
          arguments:
            - qualifier: with
              name: painting count
              condition:
                operator: =
                value: "1"
      trigger:
        name: painting removed from cart
      result:
        name: cart empty
    - id: "018"
      states:
        - name: cart non-empty
      trigger:
        name: painting reservation confirmed
      result:
        name: cart empty
      notes: Backend clears all cart items on confirmed reservation
    - id: "019"
      states:
        - name: cart non-empty
      trigger:
        name: painting cart hold expired
      result:
        name: cart empty
      notes: Server-side expiry
    - id: "020"
      states:
        - name: cart non-empty
      trigger:
        name: user signed out
      result:
        name: cart empty
      notes: Signing out flushes all in-cart paintings
  impossible:
    defined:
      - states:
          - user session absent
        trigger:
          name: painting added to cart
      - states:
          - user session absent
        trigger:
          name: painting removed from cart
