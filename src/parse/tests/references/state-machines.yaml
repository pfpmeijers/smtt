- name: user authentication
  overview: Users are identified by email address only. No passwords or other
    credentials are used.
  states:
    - name: user authenticated
    - name: user unauthenticated
  initialState: user unauthenticated
  data:
    email address: ""
  dataExampleValues:
    - email address: info@domain.com
    - email address: other@example.com
  defaultPreconditions:
    - state: user session present
  transitions:
    - id: "014"
      states:
        - name: default user identity available
          arguments:
            - qualifier: as
              name: email address
        - name: user session absent
        - name: user unauthenticated
      trigger:
        name: user session present
      result:
        name: user authenticated
        arguments:
          - qualifier: as
            name: email address
      notes: Implicitly signed in
    - id: "015"
      states:
        - name: default user identity unavailable
        - name: user session absent
        - name: user unauthenticated
      trigger:
        name: user session present
      result:
        name: user unauthenticated
    - id: "016"
      states:
        - name: default user identity available
          arguments:
            - qualifier: as
              name: email address
        - name: user session present
        - name: user unauthenticated
      trigger:
        name: sign in started with email address prefilled
      result:
        name: user unauthenticated
