- name: default user identity
  overview: Default user identity is the email address persisted for the user
    device's browser in its local storage, if any.
  states:
    - name: default user identity unavailable
      description: No email address persisted for device's browser.
    - name: default user identity available
      description: Email address persisted for device's browser.
  initialState: default user identity unavailable
  data:
    email address: ""
  dataExampleValues:
    - email address: info@domain.com
  defaultPreconditions: []
  transitions:
    - id: "001"
      states:
        - name: user session present
        - name: default user identity unavailable
        - name: painting in cart
      trigger:
        name: user authenticated
        arguments:
          - qualifier: as
            name: email address
      result:
        name: default user identity available
        arguments:
          - qualifier: as
            name: email address
      notes: Stored in browser local storage
    - id: "002"
      states:
        - name: default user identity available
      trigger:
        name: browser local storage cleared
      result:
        name: default user identity unavailable
      notes: Action outside application scope
  impossible:
    defined: []
  irrelevant: []
