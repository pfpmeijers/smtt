- name: painting status
  states:
    - name: painting available
      description: Painting is on sale and can be added to a cart.
    - name: painting in cart
      description: Painting is held in a user's shopping cart, pending reservation.
    - name: painting reserved
      description: Painting is reserved for a specific user.
    - name: painting sold
      description: Painting has been sold and is no longer available.
    - name: painting loaned
      description: Painting is temporarily on loan (e.g. to an exhibition).
    - name: painting archived
      description: Painting is hidden from the public gallery.
  initialState: painting available
  data:
    email address: ""
    user name: ""
  dataExampleValues:
    - email address: info@domain.com
      user name: john doe
  defaultPreconditions: []
  transitions:
    - id: "003"
      states:
        - name: user session present
        - name: painting available
      trigger:
        name: painting added to cart
      result:
        name: painting in cart
      notes: Cart hold is time-limited and will expire automatically
    - id: "004"
      states:
        - name: user session present
        - name: painting in cart
      trigger:
        name: painting reservation confirmed
      result:
        name: painting reserved
      notes: To have a painting in cart under an email address, the user must be
        authenticated
    - id: "005"
      states:
        - name: user authenticated
        - name: painting in cart
          arguments:
            - qualifier: of
              name: email address
      trigger:
        name: painting reservation confirmed
        arguments:
          - qualifier: using
            name: email address
      result:
        name: painting reserved
        arguments:
          - qualifier: for
            name: email address
      notes: To have a painting in cart under an email address, the user must be
        authenticated
    - id: "006"
      states:
        - name: user authenticated
        - name: painting in cart
          arguments:
            - qualifier: of
              name: email address
      trigger:
        name: painting cart hold expired
      result:
        name: painting available
      notes: Expiry elapsed without reservation
    - id: "007"
      states:
        - name: user authenticated
        - name: painting in cart
          arguments:
            - qualifier: of
              name: email address
      trigger:
        name: painting removed from cart
      result:
        name: painting available
    - id: "008"
      states:
        - name: user session absent
        - name: painting reserved
      trigger:
        name: painting reservation cancelled
      result:
        name: painting available
      notes: Administrative action
    - id: "009"
      states:
        - name: user session absent
        - name: painting reserved
      trigger:
        name: painting marked as sold
      result:
        name: painting sold
      notes: Administrative action
    - id: "010"
      states:
        - name: user session absent
        - name: painting available
      trigger:
        name: painting marked as loaned
      result:
        name: painting loaned
      notes: Administrative action
    - id: "011"
      states:
        - name: user session absent
        - name: painting loaned
      trigger:
        name: painting loan ended
      result:
        name: painting available
      notes: Administrative action
    - id: "012"
      states:
        - name: user session absent
        - name: painting available
      trigger:
        name: painting marked as archived
      result:
        name: painting archived
      notes: Administrative action
    - id: "013"
      states:
        - name: user session absent
        - name: painting archived
      trigger:
        name: painting unarchived
      result:
        name: painting available
      notes: Administrative action
  impossible:
    defined:
