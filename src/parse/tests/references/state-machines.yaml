- name: user profile
  overview: User profile consists of authenticated user's email address and
    optionally associated user name. Painting database contains email address to
    user name associations. Single user name may be associated with multiple
    email addresses.
  states:
    - name: user profile unavailable
    - name: unnamed user profile available
    - name: named user profile available
  initialState: user profile unavailable
  data:
    email address: ""
    user name: ""
  dataExampleValues:
    - email address: info@domain.com
      user name: john doe
    - email address: other@example.com
      user name: alice smith
