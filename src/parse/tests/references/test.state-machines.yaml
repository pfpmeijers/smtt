- name: list form transitions
  overview: "Exercises the bulleted list-form alternative for transition rules:
    mixed with the table form in the same Rules subsection, an inline id
    description, a multi-bullet Notes block, and a value wrapped onto a
    continuation line."
  states:
    - name: listed idle
    - name: listed active
      description: The counter is running.
  data:
    list count: Running count.
  dataValueCombinations:
    - list count: "0"
    - list count: "1"
  defaultPreconditions: []
  transitions:
    - states:
        - name: listed idle
      trigger:
        name: list started
        type: event
      result:
        name: listed active
      notes: Table row
      id: "030"
    - id: "002"
      states:
        - name: listed active
          arguments:
            - qualifier: with
              name: list count
              condition:
                operator: =
                value: "0"
      trigger:
        name: list counted
        arguments:
          - qualifier: with
            name: list count
            condition:
              operator: ">"
              value: "0"
        type: event
      result:
        name: listed active
        arguments:
          - preQualifier: with
            modifier: incremented
            name: list count
      notes: List-form entry with two note bullets
    - id: "003"
      states:
        - name: listed active
      trigger:
        name: list reset
        type: event
      result:
        name: listed idle
      notes: Reset back to idle.
  impossible:
    defined: []
  irrelevant: []
  initialState: listed idle
  source: smtt/src/parse/tests/state-machines/list-form-transitions.state-machine.md
