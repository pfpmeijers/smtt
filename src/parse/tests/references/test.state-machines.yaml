- name: condition reference
  overview: "Exercises attribute references on both sides they are supported: a
    result argument's result value, and a condition on a state or trigger
    argument. A backticked value names another attribute, dynamically resolved
    per row, instead of being a quoted literal. Every site that accepts a
    condition is covered — state implied condition, default precondition,
    `States` cell and `Trigger` cell — as is each operator spelling that carries
    a reference."
  states:
    - name: painting listed
      description: The painting has a list price but no sale price yet.
    - name: painting sold
      description: The painting has been sold.
      impliedConditions:
        - attribute: sale price
          condition:
            operator: as
            value: list price
            valueIsReference: true
    - name: painting offered
      description: A buyer has bid on the painting.
  data:
    list price: The painting's asking price.
    note: Free-text annotation, unrelated to any attribute name.
    bid: ""
    quoted price: ""
    reserve price: ""
    sale price: ""
  dataValueCombinations:
    - list price: "10"
      note: default
      bid: ""
      quoted price: ""
      reserve price: ""
      sale price: ""
    - list price: "20"
      note: default
      bid: ""
      quoted price: ""
      reserve price: ""
      sale price: ""
    - bid: ""
      list price: "10"
      note: default
      quoted price: "10"
      reserve price: ""
      sale price: ""
    - bid: ""
      list price: "20"
      note: default
      quoted price: "20"
      reserve price: ""
      sale price: ""
    - bid: ""
      list price: "10"
      note: archived
      quoted price: ""
      reserve price: ""
      sale price: ""
    - bid: ""
      list price: "10"
      note: default
      quoted price: ""
      reserve price: "10"
      sale price: ""
    - bid: ""
      list price: "20"
      note: default
      quoted price: ""
      reserve price: "20"
      sale price: ""
  defaultPreconditions:
    - state: user authenticated
      arguments:
        - qualifier: with
          name: quoted price
          condition:
            operator: =
            value: list price
            valueIsReference: true
      description: The price quoted to the buyer is the asking price.
  transitions:
    - states:
        - name: painting listed
          arguments:
            - qualifier: with
              name: list price
      trigger:
        name: sale confirmed
        type: event
      result:
        name: painting sold
        arguments:
          - qualifier: with
            name: sale price
            result:
              value: list price
              valueIsReference: true
          - name: note
            result:
              value: archived
      id: "021"
    - states:
        - name: painting listed
          arguments:
            - qualifier: with
              name: list price
      trigger:
        name: bid placed
        arguments:
          - qualifier: with
            name: bid
            condition:
              operator: as
              value: list price
              valueIsReference: true
        type: event
      result:
        name: painting offered
      id: "022"
    - states:
        - name: painting listed
          arguments:
            - qualifier: with
              name: reserve price
              condition:
                operator: =
                value: list price
                valueIsReference: true
      trigger:
        name: reserve met
        type: event
      result:
        name: painting offered
      id: "023"
    - states:
        - name: painting offered
          arguments:
            - qualifier: with
              name: bid
              condition:
                operator: <>
                value: list price
                valueIsReference: true
      trigger:
        name: bid withdrawn
        type: event
      result:
        name: painting listed
      id: "024"
  impossible:
    defined: []
  irrelevant: []
  initialState: painting listed
  source: smtt/src/parse/tests/state-machines/condition-reference.state-machine.md
- name: generated value combinations
  overview: "Exercises the generated spelling of the data section: rather than
    pairing values into rows by hand in a combinations table, the source lists
    the values each attribute may take, which stands for every combination of
    them. The parser records the lists as-is; deriving the rows is the complete
    step's job."
  states:
    - name: article drafted
      description: The document is being edited.
    - name: article published
      description: The document is visible to readers.
  data:
    language: The language the document is written in.
    revision: The document's revision number.
  dataValues:
    language:
      - en
      - nl
      - de
    revision:
      - "1"
      - "2"
  dataValueCombinations:
    - language: en
      revision: "1"
    - language: en
      revision: "2"
    - language: nl
      revision: "1"
    - language: nl
      revision: "2"
    - language: de
      revision: "1"
    - language: de
      revision: "2"
  defaultPreconditions: []
  transitions:
    - states:
        - name: article drafted
          arguments:
            - qualifier: with
              name: language
            - name: revision
      trigger:
        name: publish requested
        type: event
      result:
        name: article published
      id: "025"
    - states:
        - name: article published
          arguments:
            - qualifier: with
              name: language
              condition:
                operator: =
                value: nl
      trigger:
        name: withdrawal requested
        type: event
      result:
        name: article drafted
      id: "026"
  impossible:
    defined: []
  irrelevant: []
  initialState: article drafted
  source: smtt/src/parse/tests/state-machines/generated-value-combinations.state-machine.md
