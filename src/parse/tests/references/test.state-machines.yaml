- name: argument variations
  overview: Exercises data reference modifiers and value conditions recognized by
    the parser.
  states:
    - name: phase one
      description: Initial phase with no data.
    - name: phase two
      description: Phase with data and various transitions.
    - name: phase three
      description: Final phase reached through various conditions and modifiers.
  data:
    count: Number of items.
    label: Display label.
    score: Numeric score. ... extra description ...
    new label: ""
  dataValueCombinations:
    - count: "2"
      label: alpha
      score: "10"
      new label: ""
    - count: "0"
      label: beta
      score: "20"
      new label: ""
    - count: "1"
      label: beta
      score: "20"
      new label: ""
    - count: "3"
      label: beta
      score: "20"
      new label: ""
    - count: "5"
      label: beta
      score: "20"
      new label: ""
    - count: "0"
      label: alpha
      new label: ""
      score: "10"
    - count: "5"
      label: alpha
      new label: ""
      score: "10"
  defaultPreconditions:
    - state: idle
  transitions:
    - states:
        - name: phase one
      trigger:
        name: started
        arguments:
          - qualifier: for
            name: label
        type: event
      result:
        name: phase two
        arguments:
          - qualifier: for
            name: label
      notes: Plain data ref
      id: "000"
    - states:
        - name: phase two
          arguments:
            - qualifier: as
              name: label
      trigger:
        name: renamed
        arguments:
          - qualifier: to
            name: new label
        type: event
      result:
        name: phase two
        arguments:
          - qualifier: as
            name: new label
      notes: Distinct attribute for a new value
      id: "001"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: =
                value: "0"
      trigger:
        name: item added
        type: event
      result:
        name: phase two
        arguments:
          - preQualifier: with
            modifier: incremented
            name: count
      notes: Eq condition + incremented
      id: "004"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: ">"
                value: "0"
      trigger:
        name: item removed
        type: event
      result:
        name: phase two
        arguments:
          - preQualifier: with
            modifier: decremented
            name: count
      notes: Gt condition + decremented
      id: "005"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: ">="
                value: "3"
      trigger:
        name: threshold reached
        type: event
      result:
        name: phase three
      notes: Ge condition
      id: "006"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: <=
                value: "1"
      trigger:
        name: below minimum
        type: event
      result:
        name: phase one
      notes: Le condition
      id: "007"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: <>
                value: "0"
            - name: score
              condition:
                operator: ">="
                value: "10"
      trigger:
        name: non-empty confirmed
        type: event
      result:
        name: phase two
        arguments:
          - preQualifier: with
            modifier: next
            name: score
      notes: Ne condition + next modifier
      id: "008"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: <
                value: "5"
            - name: score
              condition:
                operator: =
                value: "10"
      trigger:
        name: space available
        type: event
      result:
        name: phase two
        arguments:
          - preQualifier: with
            modifier: previous
            name: score
      notes: Lt condition + previous modifier
      id: "009"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: in range
                value: "[1, 5]"
      trigger:
        name: range validated
        type: event
      result:
        name: phase three
      notes: Range condition
      id: "010"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: score
              condition:
                operator: in range
                value: "[10, 20)"
      trigger:
        name: lower band confirmed
        type: event
      result:
        name: phase three
      notes: "Range: exclusive upper bound"
      id: "011"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: score
              condition:
                operator: in range
                value: (10, 20]
      trigger:
        name: upper band confirmed
        type: event
      result:
        name: phase three
      notes: "Range: exclusive lower bound"
      id: "012"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: label
              condition:
                operator: in
                value:
                  - alpha
                  - beta
      trigger:
        name: selected from set
        type: event
      result:
        name: phase three
      notes: Set condition
      id: "013"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: label
              condition:
                operator: =
                value: alpha
      trigger:
        name: default confirmed
        type: event
      result:
        name: phase three
      notes: "Text equality: literal value"
      id: "014"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: label
              condition:
                operator: <>
                value: alpha
      trigger:
        name: custom confirmed
        type: event
      result:
        name: phase three
      notes: "Text inequality: literal value"
      id: "015"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: not in range
                value: "[1, 5]"
      trigger:
        name: out-of-range confirmed
        type: event
      result:
        name: phase three
      notes: Not-in-range condition
      id: "016"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: label
              condition:
                operator: not in
                value:
                  - alpha
                  - beta
      trigger:
        name: unlisted label confirmed
        type: event
      result:
        name: phase three
      notes: Not-in-set condition
      id: "017"
    - states:
        - name: phase three
      trigger:
        name: reset
        type: event
      result:
        name: phase one
      notes: Simple reset
      id: "018"
  impossible:
    defined: []
  irrelevant: []
  initialState: phase one
  source: smtt/src/parse/tests/state-machines/argument-variations.state-machine.md
