- name: rich sections machine
  overview: This state machine validates dependency entries, data examples, and
    table-based transition constraints.
  states:
    - name: awaiting payment
      description: Waiting for user confirmation.
    - name: verified user
      description: User identity was verified.
    - name: reserved stock
      description: Inventory was tentatively reserved.
    - name: completed
      description: The process is finished.
  data:
    customer id: Stable customer identifier.
    quantity: Ordered amount.
    tier: Customer level.
  dataExampleValues:
    - customer id: A-42
      quantity: "5"
      tier: gold
    - customer id: B-21
      quantity: "9"
      tier: silver
    - customer id: C-11
      quantity: "1"
      tier: bronze
  dataOtherValues:
    - customer id: D-99
      quantity: "0"
      tier: gold
    - customer id: D-99
      quantity: "10"
      tier: gold
  defaultPreconditions:
    - state: idling
    - state: user authenticated
  transitions:
    - states:
        - name: awaiting payment
      trigger:
        name: reserve
        arguments:
          - qualifier: for
            name: customer id
        type: event
      result:
        name: reserved stock
        arguments:
          - qualifier: for
            name: customer id
      notes: Event with argument parsing.
    - states:
        - name: reserved stock
          arguments:
            - qualifier: with
              name: quantity
              condition:
                operator: in range
                value:
                  - "1"
                  - "10"
            - name: customer id
              condition:
                operator: =
                value: B-21
      trigger:
        name: confirmation
        arguments:
          - preQualifier: by
            modifier: next
            name: customer id
        type: event
      result:
        name: completed
      notes: Range condition and modifier.
    - states:
        - name: reserved stock
          arguments:
            - qualifier: for
              name: tier
              condition:
                operator: not in
                value:
                  - gold
                  - silver
              suffix: "`"
      trigger:
        name: reject
        type: event
      result:
        name: awaiting payment
      notes: Set-negation condition.
    - states:
        - name: reserved stock
      trigger:
        name: confirmation
        arguments:
          - qualifier: of
            name: quantity
            condition:
              operator: =
              value: "1"
        type: event
      result:
        name: reserved stock
        arguments:
          - preQualifier: with
            modifier: incremented
            name: quantity
            suffix: of 1 unit
      notes: Argument suffix text is preserved.
  impossible:
    defined:
      - states:
          - awaiting payment
        trigger:
          name: pay
          arguments:
            - qualifier: with
              name: quantity
              condition:
                operator: <
                value: "0"
          type: event
      - states:
          - reserved stock
          - verified user
        trigger:
          name: drop
          arguments:
            - qualifier: for
              name: customer id
          type: event
  irrelevant:
    - states:
        - completed
      trigger:
        name: ping
        type: event
    - states:
        - completed
      trigger:
        name: check status
        type: event
  initialState: awaiting payment
  source: C:\Users\pfpme\WebstormProjects\Malerien\tests\smtt\src\parse\tests\state-machines\rich-sections.state-machine.md
