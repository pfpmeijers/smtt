- name: argument variations
  overview: Exercises data reference modifiers and value conditions recognized by
    the parser.
  states:
    - name: phase one
      description: Initial phase with no data.
    - name: phase two
      description: Phase with data and various transitions.
    - name: phase three
      description: Final phase reached through various conditions and modifiers.
  data:
    count: Number of items.
    label: Display label.
    score: Numeric score. ... extra description ...
  dataExampleValues:
    - count: "2"
      label: alpha
      score: "10"
  dataOtherValues:
    - count: "0"
      label: beta
      score: "20"
    - count: "1"
      label: beta
      score: "20"
    - count: "3"
      label: beta
      score: "20"
    - count: "5"
      label: beta
      score: "20"
  defaultPreconditions:
    - state: idle
  transitions:
    - states:
        - name: phase one
      trigger:
        name: started
        arguments:
          - qualifier: for
            name: label
        type: event
      result:
        name: phase two
        arguments:
          - qualifier: for
            name: label
      notes: Plain data ref
    - states:
        - name: phase two
          arguments:
            - qualifier: as
              name: label
      trigger:
        name: renamed
        arguments:
          - preQualifier: to
            modifier: different
            name: label
        type: event
      result:
        name: phase two
        arguments:
          - qualifier: as
            name: label
      notes: "Negation: different"
    - states:
        - name: phase two
          arguments:
            - qualifier: as
              name: label
      trigger:
        name: swapped
        arguments:
          - preQualifier: with
            modifier: other
            name: label
        type: event
      result:
        name: phase two
        arguments:
          - qualifier: as
            name: label
      notes: "Negation: not"
    - states:
        - name: phase two
          arguments:
            - qualifier: as
              name: label
      trigger:
        name: replaced
        arguments:
          - preQualifier: by
            modifier: unequal
            name: label
        type: event
      result:
        name: phase two
        arguments:
          - qualifier: as
            name: label
      notes: "Negation: unequal"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: =
                value: "0"
      trigger:
        name: item added
        type: event
      result:
        name: phase two
        arguments:
          - preQualifier: with
            modifier: incremented
            name: count
      notes: Eq condition + incremented
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: ">"
                value: "0"
      trigger:
        name: item removed
        type: event
      result:
        name: phase two
        arguments:
          - preQualifier: with
            modifier: decremented
            name: count
      notes: Gt condition + decremented
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: ">="
                value: "3"
      trigger:
        name: threshold reached
        type: event
      result:
        name: phase three
      notes: Ge condition
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: <=
                value: "1"
      trigger:
        name: below minimum
        type: event
      result:
        name: phase one
      notes: Le condition
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: <>
                value: "0"
            - name: score
              condition:
                operator: ">="
                value: "10"
      trigger:
        name: non-empty confirmed
        type: event
      result:
        name: phase two
        arguments:
          - preQualifier: with
            modifier: next
            name: score
      notes: Ne condition + next modifier
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: <
                value: "5"
            - name: score
              condition:
                operator: =
                value: "10"
      trigger:
        name: space available
        type: event
      result:
        name: phase two
        arguments:
          - preQualifier: with
            modifier: previous
            name: score
      notes: Lt condition + previous modifier
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: in range
                value:
                  - "1"
                  - "5"
      trigger:
        name: range validated
        type: event
      result:
        name: phase three
      notes: Range condition
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: label
              condition:
                operator: in
                value:
                  - alpha
                  - beta
      trigger:
        name: selected from set
        type: event
      result:
        name: phase three
      notes: Set condition
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: label
              condition:
                operator: as
                value: alpha
      trigger:
        name: default confirmed
        type: event
      result:
        name: phase three
      notes: "Text equality: literal value"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: label
              condition:
                operator: not as
                value: alpha
      trigger:
        name: custom confirmed
        type: event
      result:
        name: phase three
      notes: "Text inequality: literal value"
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: count
              condition:
                operator: not in range
                value:
                  - "1"
                  - "5"
      trigger:
        name: out-of-range confirmed
        type: event
      result:
        name: phase three
      notes: Not-in-range condition
    - states:
        - name: phase two
          arguments:
            - qualifier: with
              name: label
              condition:
                operator: not in
                value:
                  - alpha
                  - beta
      trigger:
        name: unlisted label confirmed
        type: event
      result:
        name: phase three
      notes: Not-in-set condition
    - states:
        - name: phase three
      trigger:
        name: reset
        type: event
      result:
        name: phase one
      notes: Simple reset
  impossible:
    defined: []
  irrelevant: []
  initialState: phase one
